openapi: 3.1.0
info:
  title: DAR — DarGlobal AI Property Assistant API
  description: Retrieval-Augmented Generation (RAG) assistant for DarGlobal and Wasalt
    real estate.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - System
      summary: Health Check
      description: Health check endpoint for Docker & deployment monitoring (DAR-24,
        DAR-27).
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/stats:
    get:
      tags:
      - System
      summary: Get Stats
      description: Return dataset statistics from data/summary.json (DAR-19, DAR-24).
      operationId: get_stats_api_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/chat:
    post:
      tags:
      - Chat
      summary: Chat
      description: Ask a question to the DarGlobal and Wasalt property assistant (DAR-24).
      operationId: chat_api_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ChatRequest:
      properties:
        query:
          type: string
          maxLength: 1000
          title: Query
          example: What are the starting prices for The Astera by Aston Martin?
        site:
          anyOf:
          - type: string
            enum:
            - darglobal
            - wasalt
          - type: 'null'
          title: Site
          description: Optional filter by property portal
      type: object
      required:
      - query
      title: ChatRequest
    ChatResponse:
      properties:
        answer_text:
          type: string
          title: Answer Text
          description: Clean conversational answer text
        highlights:
          items:
            type: string
          type: array
          title: Highlights
          description: Key bullet highlights or specifications
        sources:
          items:
            $ref: '#/components/schemas/SourceItem'
          type: array
          title: Sources
          description: Verified sources with id, title, and url
        model_used:
          type: string
          title: Model Used
          description: OpenRouter model name
        latency_ms:
          type: number
          title: Latency Ms
          description: Request latency in milliseconds
        cached:
          type: boolean
          title: Cached
          description: Whether the answer was served from the answer cache
          default: false
        answer:
          anyOf:
          - {}
          - type: 'null'
          title: Answer
          description: Backward compatibility alias for answer_text
      type: object
      required:
      - answer_text
      - model_used
      - latency_ms
      title: ChatResponse
      description: Structured response payload complying with requirements.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SourceItem:
      properties:
        id:
          type: integer
          title: Id
          description: 1-based source identifier
        title:
          type: string
          title: Title
          description: Source document or listing title
        url:
          type: string
          title: Url
          description: Verified canonical URL
        site:
          anyOf:
          - type: string
          - type: 'null'
          title: Site
          description: 'Portal: darglobal or wasalt'
        chunk_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Chunk Type
          description: 'Type: page, faq, or listing'
        index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Index
          description: Backward compatibility index alias
      type: object
      required:
      - id
      - title
      - url
      title: SourceItem
      description: Structured citation item for a verified knowledge source.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
